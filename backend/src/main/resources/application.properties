spring.application.name=backend

# PostgreSQL
# P6Spy - settings
spring.datasource.url=jdbc:p6spy:postgresql://localhost:5433/vali_it?currentSchema=tool_rental
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost:5433/vali_it?currentSchema=tool_rental
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=tool_rental

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# Gemini for the tool search assistant
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Estimated paid Standard API cost for gemini-3.5-flash-lite (checked 2026-10-12).
# Source: https://ai.google.dev/gemini-api/docs/pricing
# Output includes thinking tokens; cached input uses its discounted tariff.
# Set all three prices to 0 to represent the free tier. Update them when changing the model.
toolrental.ai.token-pricing.input-usd-per-million=${AI_INPUT_USD_PER_MILLION:0.30}
toolrental.ai.token-pricing.output-usd-per-million=${AI_OUTPUT_USD_PER_MILLION:2.50}
toolrental.ai.token-pricing.cached-input-usd-per-million=${AI_CACHED_INPUT_USD_PER_MILLION:0.03}
# Fixed reference rate, ECB 2026-10-09: 1 EUR = 1.1206 USD (not refreshed automatically).
# Source: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
toolrental.ai.token-pricing.usd-per-eur=${AI_USD_PER_EUR:1.1206}

# Booking request email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
toolrental.frontend-url=http://localhost:8081
