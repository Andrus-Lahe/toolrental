spring.application.name=backend

# PostgreSQL
# P6Spy - settings
spring.datasource.url=jdbc:p6spy:postgresql://localhost/vali_it
spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
#spring.datasource.driverClassName=org.postgresql.Driver
#spring.datasource.url=jdbc:postgresql://localhost/vali_it
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# Groq AI (OpenAI-ühilduv API). Võti tuleb keskkonnamuutujast GROQ_API_KEY, mitte siit failist.
# NB: Spring AI 2.x ei lisa aadressile /v1 ise, seega peab see olema base-url lõpus.
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.max-tokens=1024
